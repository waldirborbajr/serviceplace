services:

  # ---------------------------------------------------------------------------
  # PHP 8.5 FPM
  # ---------------------------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform_php
    restart: unless-stopped
    volumes:
      # Código fonte montado como volume — edita localmente, reflete no container
      - ../:/var/www/html:delegated
      # Persiste o banco SQLite fora do container
      - sqlite_data:/var/www/html
    environment:
      JWT_SECRET: "${JWT_SECRET:-dev-secret-troque-em-producao}"
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # Nginx
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine     # alpine = menor superfície de ataque
    container_name: platform_nginx
    restart: unless-stopped
    ports:
      - "8080:80"               # acessa em http://localhost:8080
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../:/var/www/html:delegated
    depends_on:
      - php
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # MySQL (opcional — comente se usar só SQLite)
  # Descomente quando quiser testar a troca de banco.
  # Troque DB_DSN no api.php para 'mysql:host=mysql;dbname=platform;charset=utf8mb4'
  # ---------------------------------------------------------------------------
  # mysql:
  #   image: mysql:8.4           # 8.4 LTS — suporte até 2032
  #   container_name: platform_mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
  #     MYSQL_DATABASE:      platform
  #     MYSQL_USER:          platform
  #     MYSQL_PASSWORD:      "${MYSQL_PASSWORD:-platform}"
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - platform

networks:
  platform:
    driver: bridge

volumes:
  sqlite_data:
  # mysql_data:    # descomente junto com o serviço mysql acima
