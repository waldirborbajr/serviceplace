services:

  # ---------------------------------------------------------------------------
  # PHP 8.5 FPM
  # ---------------------------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform_php
    restart: unless-stopped
    volumes:
      # Código fonte montado como volume — edita localmente, reflete no container.
      # NÃO montar nada em /var/www/html (sombrearia o bind mount).
      # O SQLite vive em ./data/platform.db, já criado e com dono correto no host.
      - ../:/var/www/html:delegated
    environment:
      JWT_SECRET: "${JWT_SECRET:-dev-secret-troque-em-producao}"
      PASSWORD_PEPPER: "${PASSWORD_PEPPER:-dev-pepper-troque-em-producao}"
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # Nginx
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine     # alpine = menor superfície de ataque
    container_name: platform_nginx
    restart: unless-stopped
    ports:
      - "8080:80"               # acessa em http://localhost:8080
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../:/var/www/html:delegated
    depends_on:
      - php
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # MySQL (opcional — comente se usar só SQLite)
  # Descomente quando quiser testar a troca de banco.
  # Troque DB_DSN em src/Core/Configuration.php para
  # 'mysql:host=mysql;dbname=platform;charset=utf8mb4'
  # e DB_USER/DB_PASS para platform/platform.
  # ---------------------------------------------------------------------------
  # mysql:
  #   image: mysql:8.4           # 8.4 LTS — suporte até 2032
  #   container_name: platform_mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
  #     MYSQL_DATABASE:      platform
  #     MYSQL_USER:          platform
  #     MYSQL_PASSWORD:      "${MYSQL_PASSWORD:-platform}"
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - platform

networks:
  platform:
    driver: bridge

# volumes:
#   mysql_data:                  # descomente junto com o serviço mysql acima.
