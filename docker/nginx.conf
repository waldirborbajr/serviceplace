server {
    listen      80;
    server_name localhost;

    root  /var/www/html;
    index api.php;

    # Charset
    charset utf-8;

    # --- Front controller: tudo vai para api.php ---
    location / {
        try_files $uri $uri/ /api.php?$query_string;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        # Bloqueia acesso direto a qualquer .php exceto api.php
        # (proteção contra execução acidental de uploads ou arquivos internos)
        if ($uri !~ ^/api\.php$) {
            return 403;
        }

        fastcgi_pass   php:9000;
        fastcgi_index  api.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        # Passa o header Authorization (necessário para JWT)
        fastcgi_param  HTTP_AUTHORIZATION $http_authorization;
    }

    # --- Bloqueia acesso a arquivos sensíveis ---
    location ~* \.(db|sqlite|env|ini|log|sh)$ {
        return 403;
    }

    # Sem logs de favicon/robots em dev
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # Logs para stdout/stderr (visível no docker compose logs)
    access_log  /dev/stdout;
    error_log   /dev/stderr warn;
}
