; =============================================================================
; Overrides PHP para ambiente de desenvolvimento
; Nunca usar em produção — erros expostos, sem opcode cache
; =============================================================================

; Erros
display_errors        = On
display_startup_errors = On
error_reporting       = E_ALL
log_errors            = On

; Limites generosos para dev (ajustar em produção)
memory_limit          = 256M
max_execution_time    = 60
post_max_size         = 32M
upload_max_filesize   = 32M

; Timezone
date.timezone         = America/Sao_Paulo

; SQLite — sem configuração extra necessária
; PDO já habilitado via docker-php-ext-install

; Segurança: desabilitar funções perigosas mesmo em dev
; (bom hábito — evita surpresas ao subir para produção)
disable_functions     = exec,passthru,shell_exec,system,proc_open,popen,\
                        curl_exec,curl_multi_exec,parse_ini_file,show_source
